<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>入庫驗收</title>
<script src="https://unpkg.com/@zxing/library@0.20.0"></script>
<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@2.2.4/dist/iife/reader/index.js"></script>
<style>
  :root { --accent:#3f5871; --accent-dark:#2d4054; --soft:#eef2f6; --ink:#24303d; --mid:#5b6875; --mute:#8a949f; --line:#e2e6ea; --bg:#f7f8f9; --ok:#2f6b4a; --err:#97392f; --warn:#8a6321; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; overscroll-behavior:none; }
  body { font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; background:var(--bg); color:var(--ink); font-size:16px; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  button { font:inherit; color:inherit; background:#fff; border:1px solid var(--line); border-radius:10px; cursor:pointer; }
  button:active { background:var(--soft); }
  button:disabled { opacity:.4; cursor:default; }
  .mono { font-family:ui-monospace,Consolas,Menlo,monospace; }
  .hidden { display:none !important; }

  #app { height:100dvh; display:grid; grid-template-rows:auto auto auto auto auto minmax(0,1fr) auto; gap:8px; padding:0 0 10px; }
  header { display:flex; align-items:center; gap:12px; padding:10px 14px; background:var(--accent); color:#fff; }
  header h1 { font-size:18px; font-weight:700; letter-spacing:.06em; }
  #btnWho { margin-left:auto; background:transparent; border-color:rgba(255,255,255,.5); color:#fff; padding:6px 12px; font-size:15px; text-align:right; line-height:1.3; }
  #btnWho small { display:block; font-size:12px; opacity:.85; }
  #sync { font-size:13px; white-space:nowrap; }
  #sync.bad { color:#ffd9d4; font-weight:700; }

  #summary { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:0 10px; }
  .sum { background:#fff; border:1px solid var(--line); border-radius:10px; padding:6px 4px; text-align:center; }
  .sum b { display:block; font-size:22px; font-variant-numeric:tabular-nums; }
  .sum span { font-size:12px; color:var(--mid); }
  .sum[data-f] { cursor:pointer; }
  .sum[data-f]:active { background:var(--soft); }
  .sum.on { border:2px solid var(--accent); background:var(--soft); }
  .sum.on span { color:var(--accent); font-weight:700; }
  .sum.warn { border-color:var(--err); background:#fbeeec; }
  .sum.warn b, .sum.warn span { color:var(--err); font-weight:700; }

  #card { margin:0 10px; min-height:96px; background:#fff; border:2px solid var(--line); border-radius:14px; padding:10px 14px; display:flex; align-items:center; gap:14px; }
  #card.ok { border-color:var(--ok); }
  #card.err { border-color:var(--err); }
  #card .info { flex:1; min-width:0; }
  #card .nm { font-size:20px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #card .cd { font-size:14px; color:var(--mid); }
  #card .cnt { text-align:center; min-width:96px; }
  #card .cnt b { display:block; font-size:40px; line-height:1.05; font-variant-numeric:tabular-nums; color:var(--accent); }
  #card .cnt span { font-size:13px; color:var(--mid); }
  #card .wait { flex:1; text-align:center; color:var(--mid); font-size:17px; }

  #msg { margin:0 10px; min-height:32px; padding:5px 12px; border-radius:8px; font-size:15px; font-weight:600; color:var(--ok); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #msg.err { background:#fbeeec; color:var(--err); white-space:normal; }

  .tools { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:0 10px; }
  .tools button { min-height:48px; font-size:16px; font-weight:600; color:var(--accent); }
  .tools .modes { grid-column:1 / -1; display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .tools .modes button { min-height:40px; font-size:15px; }
  .tools .modes button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  #typeInput { width:100%; margin-top:10px; padding:12px 14px; font-size:22px; border:2px solid var(--accent); border-radius:10px; outline:none; font-family:ui-monospace,Consolas,Menlo,monospace; user-select:text; -webkit-user-select:text; }
  #typeMsg { min-height:1.5em; }
  #typeMsg.err { color:var(--err); font-weight:700; }

  #listBox { min-height:0; margin:0 10px; display:grid; grid-template-rows:minmax(0,1fr); background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }

  #list { overflow:auto; -webkit-overflow-scrolling:touch; }
  .row { display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:10px; align-items:center; width:100%; border:0; border-bottom:1px solid var(--line); border-radius:0; padding:8px 12px; text-align:left; min-height:54px; background:#fff; }
  .row.last { background:var(--soft); }
  .row .n { font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .s { font-size:12px; color:var(--mute); }
  .row .q { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .row .q small { font-size:13px; font-weight:400; color:var(--mute); }
  .row .r { width:52px; text-align:center; font-size:13px; font-weight:700; }
  .r-same { color:var(--ok); } .r-short { color:var(--mute); } .r-lack, .r-over, .r-extra { color:var(--err); }
  .empty { padding:24px; text-align:center; color:var(--mute); }

  #btnFinish { margin:0 10px; min-height:52px; background:var(--accent); border-color:var(--accent); color:#fff; font-size:18px; font-weight:700; }
  #btnFinish.done { background:#fff; color:var(--ok); border-color:var(--ok); }

  .screen { position:fixed; inset:0; z-index:30; background:var(--bg); overflow:auto; padding:20px 14px; }
  .box { max-width:720px; margin:0 auto; }
  .box h2 { font-size:22px; color:var(--accent); margin:0 0 6px; }
  .box h3 { font-size:16px; color:var(--mid); margin:20px 0 8px; }
  .box p { font-size:14px; color:var(--mid); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px; }
  .grid button { min-height:60px; padding:6px; font-size:18px; font-weight:700; color:var(--accent); line-height:1.25; }
  .grid button small { display:block; font-size:13px; font-weight:400; color:var(--mid); }
  .grid button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .grid button.on small { color:#fff; }
  .batch { display:flex; justify-content:space-between; align-items:center; width:100%; padding:12px 14px; margin-bottom:6px; font-size:18px; font-weight:700; text-align:left; }
  .batch span { font-size:14px; font-weight:600; color:var(--mute); }
  .batch span.open { color:var(--warn); } .batch span.done { color:var(--ok); }
  button.del { padding:8px 14px; font-size:15px; font-weight:600; color:var(--err); border-color:var(--err); background:#fff; }
  #btnOutDrop { margin-bottom:6px; }
  #outList p { margin:12px 0 6px; }
  .outrow { display:flex; align-items:center; gap:8px; padding:8px 10px 8px 14px; margin-bottom:6px; background:#fff; border:1px solid var(--line); border-radius:10px; }
  .outrow div { flex:1; min-width:0; font-size:16px; font-weight:700; }
  .outrow div span { display:block; font-size:13px; font-weight:400; color:var(--mute); }
  #note { margin-top:14px; font-size:14px; color:var(--mid); min-height:1.4em; }
  #note.err { color:var(--err); font-weight:700; }

  .modal { position:fixed; inset:0; z-index:60; background:rgba(20,28,38,.5); display:none; align-items:flex-start; justify-content:center; padding:4vh 10px; }
  .modal.show { display:flex; }
  .sheet { width:min(640px,100%); max-height:90vh; display:flex; flex-direction:column; background:#fff; border-radius:14px; overflow:hidden; }
  .sheet-h { padding:14px 16px 10px; }
  .sheet-h h3 { font-size:19px; color:var(--accent); }
  .sheet-h p { font-size:14px; color:var(--mid); margin-top:4px; }
  .sheet-b { flex:1; overflow:auto; border-top:1px solid var(--line); }
  .sheet-f { display:flex; gap:8px; justify-content:flex-end; padding:10px 16px; border-top:1px solid var(--line); }
  .sheet-f button { padding:10px 22px; font-size:16px; font-weight:600; }
  .sheet-f .main { background:var(--accent); border-color:var(--accent); color:#fff; }
  #searchInput { width:100%; margin-top:8px; padding:10px 12px; font-size:18px; border:2px solid var(--line); border-radius:10px; outline:none; user-select:text; -webkit-user-select:text; }
  #searchInput:focus { border-color:var(--accent); }
  .pick { display:block; width:100%; border:0; border-bottom:1px solid var(--line); border-radius:0; padding:10px 16px; text-align:left; }
  .pick .n { font-size:17px; font-weight:600; }
  .pick .s { font-size:13px; color:var(--mute); }
  #editQty { font-size:56px; font-weight:700; text-align:center; color:var(--accent); font-variant-numeric:tabular-nums; padding:6px 0; }
  #editBoxes { display:flex; gap:6px; padding:0 16px 8px; }
  #editBoxes:empty { display:none; }
  #editBoxes button { flex:1; min-height:50px; padding:4px; background:var(--soft); border-color:var(--accent); color:var(--accent); font-size:18px; font-weight:700; line-height:1.15; }
  #editBoxes button small { display:block; font-size:12px; font-weight:400; color:var(--mid); }
  #pad { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:0 16px 10px; }
  #pad button { min-height:54px; font-size:24px; font-weight:600; }
  #pad button.fn { font-size:16px; color:var(--mid); background:var(--soft); }
  .finish-sum { padding:10px 16px; font-size:16px; line-height:1.9; }
  .finish-sum b { font-variant-numeric:tabular-nums; }

  #cam { position:fixed; inset:0; z-index:50; display:none; flex-direction:column; background:#111a24; }
  #cam.show { display:flex; }
  .cam-view { position:relative; flex:0 0 44vh; min-height:0; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  #camList { flex:1; min-height:0; overflow:auto; -webkit-overflow-scrolling:touch; background:#fff; }
  #camVideo { width:100%; height:100%; object-fit:cover; }
  .cam-frame { position:absolute; width:min(84vw,640px); height:min(20vh,200px); border:3px solid #fff; border-radius:12px; box-shadow:0 0 0 2000px rgba(17,26,36,.35); pointer-events:none; transition:border-color .15s, box-shadow .15s; }
  .cam-frame.ok  { border-width:6px; border-color:#3ecf7f; box-shadow:0 0 0 2000px rgba(47,107,74,.45); }
  .cam-frame.err { border-width:6px; border-color:#ff6b5e; box-shadow:0 0 0 2000px rgba(151,57,47,.45); }
  #camFlash { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:min(86vw,560px); padding:16px 20px; border-radius:16px; background:rgba(47,107,74,.94); color:#fff; text-align:center; pointer-events:none; display:none; }
  #camFlash.show { display:block; }
  #camFlash.err { background:rgba(151,57,47,.95); }
  #camFlash .nm { font-size:22px; font-weight:700; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #camFlash .ct { margin-top:4px; font-size:44px; font-weight:800; line-height:1.1; font-variant-numeric:tabular-nums; }
  #camFlash .ct small { font-size:20px; font-weight:600; opacity:.85; }
  .cam-bar { display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:8px; align-items:center; padding:10px 12px; background:#fff; }
  #camLast { min-width:0; font-size:13px; font-weight:600; line-height:1.3; white-space:normal; word-break:break-all; }
  #camLast.err { color:var(--err); }
  #camLast.tap { min-height:48px; display:flex; flex-direction:column; justify-content:center; padding:4px 10px; border:1px solid var(--accent); border-radius:10px; background:var(--soft); cursor:pointer; }
  #camLast.tap.err { border-color:var(--err); background:#fbeeec; }
  #camLast .t { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  #camLast .hint { margin-top:2px; font-size:12px; font-weight:700; color:var(--accent); text-decoration:underline; }
  .cam-bar button { min-height:48px; padding:0 16px; font-size:16px; font-weight:700; }
  #btnCamClose { background:var(--accent); border-color:var(--accent); color:#fff; }
  #focusTip { position:fixed; left:0; right:0; bottom:16px; z-index:25; display:none; justify-content:center; pointer-events:none; }
  #focusTip.show { display:flex; }
  #focusTip div { background:var(--err); color:#fff; font-size:17px; font-weight:700; padding:10px 20px; border-radius:10px; }

  @media (max-width:600px), (max-height:640px) {
    #app { gap:6px; padding-bottom:8px; }
    header { padding:8px 10px; gap:8px; }
    header h1 { font-size:16px; }
    #btnWho { padding:4px 8px; font-size:13px; }
    #summary { gap:4px; padding:0 8px; }
    .sum { padding:4px 2px; }
    .sum b { font-size:18px; }
    .sum span { font-size:11px; }
    #card { margin:0 8px; min-height:64px; padding:8px 10px; gap:10px; }
    #card .nm { font-size:16px; }
    #card .cd { font-size:12px; }
    #card .cnt { min-width:70px; }
    #card .cnt b { font-size:30px; }
    #card .wait { font-size:14px; }
    #msg { margin:0 8px; min-height:26px; padding:3px 10px; font-size:13px; }
    .tools { gap:4px; padding:0 8px; }
    .tools button { min-height:44px; font-size:14px; padding:0 2px; }
    .tools .modes { gap:4px; }
    .tools .modes button { min-height:36px; font-size:14px; }
    #listBox { margin:0 8px; }
    #btnFinish { margin:0 8px; min-height:46px; font-size:16px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>入庫驗收</h1>
    <span id="sync"></span>
    <button id="btnWho" type="button">選擇門市</button>
  </header>
  <div id="summary">
    <div class="sum"><b id="sumGot">0</b><span>已掃件數</span></div>
    <div class="sum"><b id="sumExpect">0</b><span>應收件數</span></div>
    <div class="sum"><b id="sumSame">0</b><span>相符品項</span></div>
    <div class="sum"><b id="sumDiff">0</b><span>差異品項</span></div>
  </div>
  <div id="card"></div>
  <div id="msg"></div>
  <div class="tools">
    <div class="modes">
      <button type="button" data-mode="cont">連續刷 +1</button>
      <button type="button" data-mode="each">逐筆輸入數量</button>
    </div>
    <button id="btnCam" type="button">相機掃描</button>
    <button id="btnShot" type="button">拍照解析</button>
    <button id="btnType" type="button">輸入條碼</button>
    <button id="btnSearch" type="button">查品項</button>
  </div>
  <input type="file" id="fShot" accept="image/*" capture="environment" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
  <div id="listBox">

    <div id="list"></div>
  </div>
  <button id="btnFinish" type="button">完成驗收</button>
</div>

<div id="setup" class="screen">
  <div class="box">
    <h2>入庫驗收</h2>
    <p>選門市、驗收人員，再選要驗的調撥單。</p>
    <h3>門市</h3>
    <div id="storeGrid" class="grid"></div>
    <div id="staffWrap" class="hidden">
      <h3>驗收人員（可複選）</h3>
      <div id="staffGrid" class="grid"></div>
    </div>
    <div id="batchWrap" class="hidden">
      <h3>調撥單（入庫驗收）</h3>
      <div id="batchList"></div>
    </div>
    <div id="outWrap" class="hidden">
      <h3>調撥出庫</h3>
      <button id="btnOut" type="button" class="batch"></button>
      <button id="btnOutDrop" type="button" class="del hidden">刪除這張草稿</button>
      <div id="outList"></div>
    </div>
    <div id="note"></div>
    <button id="btnReset" type="button" class="hidden" style="margin-top:14px;padding:10px 16px;font-size:15px;color:var(--err);border-color:var(--err);">清除這台手機的暫存</button>  </div>
</div>

<div id="searchModal" class="modal">
  <div class="sheet">
    <div class="sheet-h">
      <h3 id="searchTitle">查品項</h3>
      <input id="searchInput" type="text" placeholder="品名、品號或條碼" autocomplete="off">
    </div>
    <div id="results" class="sheet-b"></div>
    <div class="sheet-f"><button id="btnSearchClose" type="button">取消</button></div>
  </div>
</div>

<div id="editModal" class="modal">
  <div class="sheet">
    <div class="sheet-h">
      <h3 id="editName"></h3>
      <p id="editMeta"></p>
    </div>
    <div id="editQty">0</div>
    <div id="editBoxes"></div>
    <div id="pad"></div>
    <div class="sheet-f"><button id="btnEditDel" type="button" class="del hidden" style="margin-right:auto">刪除</button><button id="btnEditCancel" type="button">取消</button><button id="btnEditSave" class="main" type="button">改成這個數量</button></div>
  </div>
</div>

<div id="typeModal" class="modal">
  <div class="sheet">
    <div class="sheet-h">
      <h3>輸入條碼或品號</h3>
      <p id="typeMsg">輸入後按 Enter 或「送出」，可以一直輸入下一個</p>
      <input id="typeInput" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" placeholder="條碼或品號">
    </div>
    <div class="sheet-f"><button id="btnTypeClose" type="button">完成</button><button id="btnTypeOk" class="main" type="button">送出</button></div>
  </div>
</div>

<div id="finishModal" class="modal">
  <div class="sheet">
    <div class="sheet-h"><h3 id="finishTitle">完成驗收</h3></div>
    <div id="finishSum" class="finish-sum sheet-b"></div>
    <div class="sheet-f"><button id="btnFinishCancel" type="button">繼續掃</button><button id="btnFinishOk" class="main" type="button">確認完成</button></div>
  </div>
</div>

<div id="cam" role="dialog" aria-modal="true" aria-label="相機掃描">
  <div class="cam-view">
    <video id="camVideo" playsinline muted></video>
    <div class="cam-frame"></div>
    <div id="camFlash"><div class="nm"></div><div class="ct"></div></div>
  </div>
  <div class="cam-bar">
    <div id="camLast">條碼停在框內，每 1.5 秒算一件</div>
    <button id="btnCamFlip" type="button" class="hidden">切換鏡頭</button>
    <button id="btnCamClose" type="button">完成</button>
  </div>
  <div id="camList"></div>
</div>

<div id="focusTip"><div>點一下畫面，才能繼續掃描</div></div>

<script>
(function () {
  'use strict';
  var KEY_SESSION = 'recv.session.v1', KEY_PRODUCTS = 'recv.products.v1';
  var BATCH = 50, SYNC_IDLE_MS = 800, RETRY_MS = 8000;

  var $ = function (id) { return document.getElementById(id); };
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function codeOf(s) { return String(s == null ? '' : s).replace(/\s+/g, '').toUpperCase(); }
  var API_URL = 'https://script.google.com/macros/s/AKfycbyJlbr-CrC92V_QIu7k6LkF62Y1cAG1UT9cPl9wfAdk560AvLQcXQPtnxzS5vmPtC8a0Q/exec';
  var API_KEY = 'xwWIMabdbjw3S55gWnB269-M';
  var hasApi = !!API_URL;
  function api(action) {
    var args = Array.prototype.slice.call(arguments, 1);
    return fetch(API_URL, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key: API_KEY, action: action, args: args })
    }).then(function (r) {
      if (!r.ok) throw new Error('後端回應 ' + r.status);
      return r.json();
    }).then(function (j) {
      if (!j || !j.ok) throw new Error((j && j.error) || '後端沒有回應');
      return j.data;
    });
  }

  var S = load(KEY_SESSION, null) || {};
  S.ops = S.ops || []; S.got = S.got || {}; S.items = S.items || []; S.staff = S.staff || [];
  function persist() { save(KEY_SESSION, S); }

  var stores = [], byCode = {}, byBarcode = {}, products = [];
  var lastCode = '', lastMsg = { text: '', err: false }, filter = 'all';
  var syncing = false, syncFailed = false, syncTimer = null;

  function setProducts(rows) {
    byCode = {}; byBarcode = {}; products = [];
    rows.forEach(function (r) {
      var p = { code: r[0], name: r[1] || '', codes: String(r[2] || '').split(' ').filter(Boolean) };
      byCode[p.code] = p; products.push(p);
      p.codes.forEach(function (b) { (byBarcode[b] = byBarcode[b] || []).push(p.code); });
    });
  }

  var KEY_OUT = 'recv.out.v1';

    startCam();
  }
  function closeCam() { camOpen = false; stopCam(); $('cam').classList.remove('show'); window.focus(); }
  $('btnCam').addEventListener('click', openCam);
  $('btnCamClose').addEventListener('click', closeCam);
  $('camLast').addEventListener('click', function () { if (lastCode && ready()) openEdit(lastCode); });
  $('btnCamFlip').addEventListener('click', function () { if (camDevices.length < 2) return; camIdx = (camIdx + 1) % camDevices.length; startCam(); });

  function loadImg(file) {
    return new Promise(function (ok, no) {
      var img = new Image();
      img.onload = function () { ok(img); };
      img.onerror = function () { no(new Error('照片讀取失敗，請再拍一次')); };
      img.src = URL.createObjectURL(file);
    });
  }
  function cropData(img, x, y, sx, sy, max) {
    var sw = img.naturalWidth * sx, sh = img.naturalHeight * sy, k = Math.min(2, max / Math.max(sw, sh));
    var w = Math.round(sw * k), h = Math.round(sh * k), c = document.createElement('canvas'); c.width = w; c.height = h;
    var ctx = c.getContext('2d'); ctx.drawImage(img, img.naturalWidth * x, img.naturalHeight * y, sw, sh, 0, 0, w, h);
    return ctx.getImageData(0, 0, w, h);
  }
  function scanFileWasm(file) {
    return ZXingWASM.readBarcodesFromImageFile(file, ZXOPT).then(firstText).then(function (t) {
      if (t) return t;
      return loadImg(file).then(function (img) {
        var crops = [[0, .3, 1, .4], [0, 0, 1, .5], [0, .5, 1, .5], [.15, .25, .7, .5], [0, .15, 1, .7]], i = 0;
        function next() {
          if (i >= crops.length) { URL.revokeObjectURL(img.src); return ''; }
          var c = crops[i++];
          say('辨識中（局部放大 ' + i + '/' + crops.length + '）');
          return ZXingWASM.readBarcodesFromImageData(cropData(img, c[0], c[1], c[2], c[3], 1600), ZXOPT).then(firstText).then(function (t) {
            if (t) { URL.revokeObjectURL(img.src); return t; }
            return next();
          });
        }
        return next();
      });
    });
  }
  function scanFileLib(file) {
    return loadImg(file).then(function (img) {
      var reader = new ZXing.BrowserMultiFormatReader();
      return reader.decodeFromImageElement(img).then(function (r) { return r ? r.getText() : ''; }, function () { return ''; });
    });
  }
  function scanFile(file) {
    if (window.ZXingWASM && !wasmBroken) {
      return scanFileWasm(file).catch(function (e) { if (hasLib()) return scanFileLib(file); throw e; });
    }
    if (hasLib()) return scanFileLib(file);
    return Promise.reject(new Error('辨識元件沒有載入，請確認網路後重新整理'));
  }
  var shotBusy = false, shotTimer = null;
  $('btnShot').addEventListener('click', function () {
    if (!ready()) { say('請先選調撥單', true); return; }
    if (shotBusy) { say('上一張還在辨識中…', true); return; }
    if (camOpen) closeCam();
    unlockAudio(); $('fShot').click();
  });
  $('fShot').addEventListener('change', function () {
    var file = this.files && this.files[0]; this.value = '';
    window.focus();
    if (!file) return;
    shotBusy = true; say('辨識中…');
    clearTimeout(shotTimer);
    shotTimer = setTimeout(function () { if (shotBusy) { shotBusy = false; say('辨識太久沒有回應，請再拍一次或用「手動查品項」', true); } }, 25000);
    scanFile(file).then(function (t) {
      if (!shotBusy) return;
      shotBusy = false; clearTimeout(shotTimer);
      t = String(t || '').trim();
      if (!t) { say('照片辨識不到條碼：靠近一點讓條碼佔畫面一半寬、對焦、避開反光再拍，或用「手動查品項」', true); beepErr(); return; }
      onScan(t);
    }).catch(function (e) { shotBusy = false; clearTimeout(shotTimer); say('辨識失敗：' + ((e && e.message) || String(e)), true); });
  });

  function reloadBatch() {
    $('setup').classList.add('hidden'); render();
    say('讀取 ' + S.batch.no + ' 最新內容…');
    api('load', S.store, S.batch.id).then(function (res) {
      if (!res || !res.ok) { say((res && res.msg) || '讀不到這張單，請按右上角重新選單', true); showSetup(); return; }
      S.items = res.items; S.got = res.got || {}; S.done = !!res.done;
      persist();
      if (S.closing && !S.ops.length) { closeBatch(); return; }
      render();
      say(S.ops.length ? '有 ' + S.ops.length + ' 筆未上傳，自動補傳中' : '已更新：' + res.no + ' 應收 ' + S.items.length + ' 品');
      flush();
    }, function (err) {
      say('目前連不上系統，先用手機裡的清單，連線後補傳（' + ((err && err.message) || err) + '）', true);
      render(); flush();
    });
  }
  function init() {
    var cached = load(KEY_PRODUCTS, null);
    if (cached) setProducts(cached);
    if (!hasApi) { $('setup').classList.remove('hidden'); note('網頁還沒設定後端網址（API_URL）', true); return; }
    note('載入中…');
    api('init').then(function (res) {
      if (!res || !res.ok) { note('讀不到商品資料，請重新整理', true); return; }
      stores = res.stores; setProducts(res.products); save(KEY_PRODUCTS, res.products);
      note('');
      if (isOut()) { $('setup').classList.add('hidden'); say('調撥出庫：草稿 ' + OUT.lines.length + ' 品'); render(); }
      else if (S.batch) reloadBatch();
      else showSetup();
    }, function (err) {
      var why = (err && err.message) || String(err || '');
      if (cached && isOut()) { $('setup').classList.add('hidden'); render(); say('目前連不上系統，可以先掃，送出時要有網路（' + why + '）', true); }
      else if (cached && S.batch) { $('setup').classList.add('hidden'); render(); say('目前連不上系統，紀錄存在本機，連線後補傳（' + why + '）', true); }
      else note('載入失敗：' + why, true);
    });
  }
  init();
})();
</script>
